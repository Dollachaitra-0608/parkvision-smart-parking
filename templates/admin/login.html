<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Parking Management</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="logo">
        <img src="/static/images/logo.png" alt="logo">
        </div>
            <h1 class="welcome-title">Welcome<br>Back!</h1>
            <p class="welcome-text">Manage parking operations, monitor availability and control system access.</p>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="login-form">
                <h2 class="login-title">Login</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-input"
                                placeholder=""
                                required
                            >
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input"
                                placeholder=""
                                required
                            >
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#forgot">Forget Password?</a>
                    </div>

                    <button type="submit" class="login-button">login</button>
                </form>

                <div id="message" class="message"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/admin-auth.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
