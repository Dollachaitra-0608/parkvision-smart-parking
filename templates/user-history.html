<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking History - Parkvision</title>
    <link rel="stylesheet" href="/static/css/user-history-styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="/static/images/logo.png" alt="logo">
                <span class="logo-text">Parkvision</span>
            </div>
            <button class="menu-btn" id="menuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-right">
    <div class="menu-icon" onclick="toggleMenu()">☰</div>

    <div id="dropdownMenu" class="dropdown">
      <a href="/user-history">History Page</a>
    </div>
  </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- History Section Header -->
        <div class="history-header">
            <h1>History</h1>
            <button class="btn-pdf" onclick="downloadPDF()">
                <span class="pdf-icon">⬇</span> Download PDF
            </button>
        </div>

        <!-- History Table -->
        <div class="table-wrapper">
            <table class="history-table" id="historyTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Slot</th>
                        <th>Duration</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Sample data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Empty State Message -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <p>No parking history available</p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/static/js/user-history-script.js"></script>
</body>
</html>
